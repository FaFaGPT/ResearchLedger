[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "researchledger"
version = "0.1.0"
description = "Innovation-driven research management for coding agents"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "ResearchLedger contributors"}]
dependencies = []

[project.scripts]
researchledger = "researchledger.cli:main"

[tool.setuptools]
package-dir = {"" = "skills/researchledger/scripts"}

[tool.setuptools.packages.find]
where = ["skills/researchledger/scripts"]
